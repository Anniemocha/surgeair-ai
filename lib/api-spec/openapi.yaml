openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: surgeair
    description: SurgeAir passenger disruption operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [surgeair]
      summary: Get the current disruption dashboard
      responses:
        "200":
          description: Dashboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /passengers:
    get:
      operationId: listPassengers
      tags: [surgeair]
      summary: List fictional passenger scenarios
      responses:
        "200":
          description: Available demo scenarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PassengerScenario" }
  /passengers/select:
    post:
      operationId: selectPassenger
      tags: [surgeair]
      summary: Open a fictional scenario in the current demo session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerSelection" }
      responses:
        "200":
          description: Selected booking reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerSelection" }
        "404":
          description: Booking not found
  /channels/select:
    post:
      operationId: selectConversationChannel
      tags: [surgeair]
      summary: Intentionally switch the simulated conversation channel in this demo session
      description: Changes only the chat channel; does not send a message or run an airline tool.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationChannelSelection" }
      responses:
        "200":
          description: Selected chat channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationChannelState" }
        "400":
          description: Invalid chat channel
        "403":
          description: Cross-site selection requests are rejected
  /messages/interpret:
    post:
      operationId: interpretMessage
      tags: [surgeair]
      summary: Interpret passenger text without receiving a channel message or taking action
      description: Uses the active session booking for context. Presented flight numbers are only hints and are accepted only when they match available alternatives on that booking's route. This endpoint never sends outbound messages or performs rebooking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInterpretationInput"
      responses:
        "200":
          description: Grounded interpretation and optional clarification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageInterpretation"
        "400":
          description: Invalid interpretation request
        "404":
          description: Booking is not the active session booking
  /demo/reset:
    post:
      operationId: resetDemo
      tags: [surgeair]
      summary: Reset the current session's canonical SurgeAir demo state
      description: Resets only the current browser session to SG4821 on delayed SA204. No request body or booking identifier is accepted.
      responses:
        "200":
          description: Canonical demo state restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResetResult"
        "400":
          description: Reset requests must not include a body
        "403":
          description: Cross-site reset requests are rejected
  /bookings/{bookingReference}:
    get:
      operationId: getBooking
      tags: [surgeair]
      summary: Retrieve a passenger booking
      parameters:
        - name: bookingReference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
  /flights/{flightNumber}/status:
    get:
      operationId: getFlightStatus
      tags: [surgeair]
      summary: Get flight status and disruption information
      parameters:
        - name: flightNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flight status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"
        "404":
          description: Flight not found
  /flights/alternatives:
    get:
      operationId: searchAlternativeFlights
      tags: [surgeair]
      summary: Search available alternative flights
      parameters:
        - name: origin
          in: query
          required: true
          schema:
            type: string
        - name: destination
          in: query
          required: true
          schema:
            type: string
        - name: arrivalBefore
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-2][0-9]:[0-5][0-9]$"
      responses:
        "200":
          description: Matching alternative flights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flight"
  /bookings/rebook:
    post:
      operationId: rebookFlight
      tags: [surgeair]
      summary: Rebook a passenger after explicit confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebookInput"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebookResult"
        "400":
          description: Rebooking requires explicit confirmation
        "404":
          description: Booking or flight not found
  /bookings/rebook/prepare:
    post:
      operationId: prepareRebooking
      tags: [surgeair]
      summary: Record a selected alternative and request explicit confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareRebookingInput"
      responses:
        "200":
          description: Pending rebooking confirmation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingRebookingResult"
        "404":
          description: Booking or flight not found
  /itinerary/send:
    post:
      operationId: sendItinerary
      tags: [surgeair]
      summary: Simulate sending an updated itinerary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryInput"
      responses:
        "200":
          description: Simulated send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryResult"
  /integrations/sms/test:
    post:
      operationId: testSmsIntegration
      tags: [surgeair]
      summary: Send a guarded AWS SMS Simulator test message
      parameters:
        - name: X-SMS-Test-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsTestInput"
      responses:
        "200":
          description: AWS accepted the simulator message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsDeliveryResult"
        "400":
          description: Invalid message
        "409":
          description: AWS SMS is not selected
        "403":
          description: SMS test authorization failed
        "429":
          description: SMS test rate limit exceeded
        "502":
          description: AWS rejected the send request
        "503":
          description: AWS SMS configuration is incomplete
  /integrations/email/test:
    post:
      operationId: testEmailIntegration
      tags: [surgeair]
      summary: Send a guarded Amazon SES test email to the configured destination
      responses:
        "200":
          description: Amazon SES accepted the test email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesDeliveryResult"
        "409":
          description: Amazon SES is not selected
        "429":
          description: Amazon SES test rate limit exceeded
        "502":
          description: Amazon SES rejected the send request
        "503":
          description: Amazon SES configuration is incomplete
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Flight:
      type: object
      required: [flightNumber, origin, destination, departure, arrival, status, delayMinutes]
      properties:
        flightNumber: { type: string }
        origin: { type: string }
        destination: { type: string }
        departure: { type: string }
        arrival: { type: string }
        status: { type: string }
        delayMinutes: { type: integer }
        gate: { type: ["string", "null"] }
        aircraft: { type: ["string", "null"] }
    Booking:
      type: object
      required: [bookingReference, passengerId, passengerName, currentFlight, origin, destination]
      properties:
        bookingReference: { type: string }
        passengerId: { type: string }
        passengerName: { type: string }
        currentFlight: { $ref: "#/components/schemas/Flight" }
        origin: { type: string }
        destination: { type: string }
        status: { type: string }
    PassengerScenario:
      type: object
      required: [bookingReference, passengerName, travelers, origin, destination, originalFlight, disruptionReason, scenarioType, suggestedRequirement]
      properties:
        bookingReference: { type: string }
        passengerName: { type: string }
        travelers: { type: integer }
        origin: { type: string }
        destination: { type: string }
        originalFlight: { $ref: "#/components/schemas/Flight" }
        disruptionReason: { type: string }
        scenarioType: { type: string }
        suggestedRequirement: { type: string }
        revisedDeparture: { type: string }
        revisedArrival: { type: string }
        terminal: { type: string }
    PassengerSelection:
      type: object
      required: [bookingReference]
      properties:
        bookingReference: { type: string }
    ConversationChannelSelection:
      type: object
      required: [channel]
      properties:
        channel: { type: string, enum: [SMS, WhatsApp, RCS] }
    ConversationChannelState:
      type: object
      required: [currentChannel]
      properties:
        currentChannel: { type: string, enum: [SMS, WhatsApp, RCS] }
    MessageInterpretationInput:
      type: object
      required: [text, bookingReference]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        bookingReference: { type: string }
        presentedFlightNumbers:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: "^[Ss][Aa][0-9]{3}$"
    MessageInterpretation:
      type: object
      required: [intent, arrivalBefore, selectedFlight, provider, clarification]
      properties:
        intent: { type: string }
        arrivalBefore:
          type: ["string", "null"]
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        selectedFlight: { type: ["string", "null"] }
        provider: { type: string, enum: [local, amazon-bedrock] }
        clarification: { type: ["string", "null"] }
    Activity:
      type: object
      required: [id, label, detail, status, timestamp]
      properties:
        id: { type: string }
        label: { type: string }
        detail: { type: string }
        status: { type: string }
        timestamp: { type: string }
    ConversationMessage:
      type: object
      required: [id, channel, sender, text, timestamp]
      properties:
        id: { type: string }
        channel: { type: string }
        sender: { type: string }
        text: { type: string }
        timestamp: { type: string }
    Dashboard:
      type: object
      required: [booking, disruption, messages, activities, selectedAlternative, confirmationStatus, actionStatus, orchestration, integrationStatus]
      properties:
        booking: { $ref: "#/components/schemas/Booking" }
        disruption: { $ref: "#/components/schemas/Flight" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ConversationMessage" }
        activities:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        selectedAlternative:
          type: ["string", "null"]
        confirmationStatus: { type: string }
        actionStatus: { type: string }
        orchestration:
          $ref: "#/components/schemas/OrchestrationState"
        integrationStatus:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationReadiness"
    DemoResetResult:
      type: object
      required: [success, booking, flight, status]
      properties:
        success: { type: boolean, enum: [true] }
        booking: { type: string, enum: [SG4821] }
        flight: { type: string, enum: [SA204] }
        status: { type: string, enum: [Disrupted] }
    OrchestrationState:
      type: object
      required: [conversationId, currentChannel, previousChannel, currentIntent, currentAgentState, lastToolCalled, modelProvider, model, region, modelStatus, modelLatencyMs, modelFallbackReason]
      properties:
        conversationId: { type: string }
        currentChannel: { type: string }
        previousChannel: { type: ["string", "null"] }
        currentIntent: { type: ["string", "null"] }
        currentAgentState: { type: string }
        lastToolCalled: { type: ["string", "null"] }
        modelProvider: { type: string }
        model: { type: string }
        region: { type: ["string", "null"] }
        modelStatus: { type: string }
        modelLatencyMs: { type: ["integer", "null"] }
        modelFallbackReason: { type: ["string", "null"] }
    IntegrationReadiness:
      type: object
      required: [service, status]
      properties:
        service: { type: string }
        status: { type: string }
        detail: { type: string }
    SmsTestInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1600
    SmsDeliveryResult:
      type: object
      required: [success, provider, mode, messageId, destination, status, timestamp]
      properties:
        success: { type: boolean }
        provider: { type: string }
        mode:
          type: string
          enum: [simulator]
        messageId:
          type: ["string", "null"]
        destination: { type: string }
        status: { type: string }
        timestamp: { type: string }
    RebookInput:
      type: object
      required: [bookingReference, newFlight, confirmation]
      properties:
        bookingReference: { type: string }
        newFlight: { type: string }
        confirmation: { type: boolean }
    PrepareRebookingInput:
      type: object
      required: [bookingReference, newFlight]
      properties:
        bookingReference: { type: string }
        newFlight: { type: string }
    PendingRebookingResult:
      type: object
      required: [selectedFlight, confirmationStatus, message]
      properties:
        selectedFlight: { type: string }
        confirmationStatus: { type: string }
        message: { type: string }
    RebookResult:
      type: object
      required: [booking, actionStatus, message]
      properties:
        booking: { $ref: "#/components/schemas/Booking" }
        actionStatus: { type: string }
        message: { type: string }
    ItineraryInput:
      type: object
      required: [bookingReference, channel]
      properties:
        bookingReference: { type: string }
        channel: { type: string }
    ItineraryResult:
      type: object
      required: [sent, channel, message, sentAt]
      properties:
        sent: { type: boolean }
        channel: { type: string }
        message: { type: string }
        sentAt: { type: string }
    SesDeliveryResult:
      type: object
      required: [success, provider, mode, messageId, destination, status, latencyMs]
      properties:
        success: { type: boolean, enum: [true] }
        provider: { type: string, enum: [amazon-ses] }
        mode: { type: string, enum: [live] }
        messageId: { type: string }
        destination: { type: string }
        status: { type: string, enum: [accepted] }
        latencyMs: { type: integer }

